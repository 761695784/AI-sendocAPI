# Les mots de passe viennent du fichier .env (jamais écrits ici).
services:
  mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-DocTrack}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5

  docback:
    build: .
    image: docback
    ports:
      - "8182:8181"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  mysql_data:
    driver: local
